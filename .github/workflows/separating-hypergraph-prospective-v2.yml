name: Separating Hypergraph Prospective V2

on:
  push:
    branches:
      - separating-hypergraph-prospective-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preregistered-prospective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify preregistration exists
        run: |
          test -f spec/SEPARATING_HYPERGRAPH_PROSPECTIVE_V2_PREREG.md
          grep -q 6288e8aaa87b40f56bd0bc4adfa2c1f0c1bef5ac scripts/separating_hypergraph_prospective_v2.py
      - name: Run frozen prospective tests
        run: python -m unittest discover -s tests -p 'test_separating_hypergraph_prospective_v2.py' -v
      - name: Emit prospective report
        run: |
          python -m scripts.separating_hypergraph_prospective_v2 > separating-hypergraph-prospective-v2.json
          cat separating-hypergraph-prospective-v2.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: separating-hypergraph-prospective-v2
          path: separating-hypergraph-prospective-v2.json
