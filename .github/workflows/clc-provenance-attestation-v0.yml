name: CLC Provenance Attestation V0

on:
  push:
    branches:
      - feature/clc-provenance-attestation-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify qualified parent and trusted waist
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8d2323da735720478c50eab068f844d9a3c0948d "$GITHUB_SHA"
          test "$(git hash-object runtime/metatron/nucleus.py)" = "d9d4293e54471714bf098593bf4018c3f6403273"
          test "$(git hash-object formal/Metatron/WarrantGraph.lean)" = "d2affc0a57a1815f303f6f1859941465c69e7d32"
          test "$(git hash-object formal_adapter/CLCMetatronAdapter/CertificateProvenance.lean)" = "b3b51be7410410c4bf45b523fb221df84203fcf4"
          echo "QUALIFIED_PARENT_AND_WAIST=PASS"

      - name: Verify pinned external CLC certificate source
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/heathsanchez/Minimal-Sufficient-Interface/900a73c1d386ee0eee1205a1cf31d270f3311ef7/qcklean/CLC/Fixtures.lean" -o /tmp/Fixtures.lean
          test "$(git hash-object /tmp/Fixtures.lean)" = "ead1d6f1da004770f93539f589acd83a35578a15"
          grep -q 'CertId := Unit' /tmp/Fixtures.lean
          grep -q 'def positiveAuthority : AuthoritySnapshot Unit' /tmp/Fixtures.lean
          echo "PINNED_EXTERNAL_CLC_CERT_SOURCE=PASS"

      - name: Validate attestation manifest
        run: |
          python scripts/generate_clc_provenance_attestation_v0.py
          git diff --exit-code --             evidence/integration/clc-provenance-attestation-v0.json             formal_adapter/CLCMetatronAdapter/ProvenanceAttestationGenerated.lean
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/integration/clc-provenance-attestation-v0.json").read_text())
          assert d["status"] == "CANDIDATE_UNQUALIFIED"
          assert d["binding"]["certificate_value"] == "()"
          assert d["binding"]["warrant_index"] == 0
          assert d["certificate_source"]["blob"] == "ead1d6f1da004770f93539f589acd83a35578a15"
          assert d["warrant_source"]["blob"] == "d2affc0a57a1815f303f6f1859941465c69e7d32"
          print("PROVENANCE_ATTESTATION_MANIFEST=PASS")
          PY

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Recheck unchanged root Metatron
        run: |
          lake build Metatron
          lake build metatron_reference

      - name: Reject proof placeholders
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)'             formal_adapter/CLCMetatronAdapter             formal_adapter/CLC             formal_adapter/Metatron

      - name: Build generated provenance witness
        run: |
          cd formal_adapter
          lake update
          lake exe cache get
          lake build CLCMetatronAdapter
          mkdir -p ../out
          lake env lean CLCMetatronAdapter/ProvenanceAttestationAudit.lean             | tee ../out/provenance-attestation-axiom-audit.txt

      - name: Enforce axiom boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("out/provenance-attestation-axiom-audit.txt").read_text()
          assert "sorryAx" not in text, text
          allowed={"propext","Classical.choice","Quot.sound"}
          compact=" ".join(text.splitlines())
          tails=compact.split("depends on axioms:")[1:]
          assert tails, text
          for tail in tails:
              inside=tail.split("[",1)[1].split("]",1)[0]
              seen={x.strip() for x in inside.split(",") if x.strip()}
              assert seen <= allowed, (inside, seen-allowed)
          print("PROVENANCE_ATTESTATION_AXIOM_BOUNDARY=PASS")
          PY

      - name: Re-run retained Python authority suite
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          count=suite.countTestCases()
          print("PYTHON_TEST_COUNT",count)
          assert count == 32, count
          PY
          python -m unittest discover -s tests -p 'test_*.py' -v             2>&1 | tee out/python-tests.txt

      - name: Emit qualification artifact
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          src=json.loads(Path("evidence/integration/clc-provenance-attestation-v0.json").read_text())
          d={
            "schema":"metatron.clc-provenance-attestation-v0.qualification",
            "status":"HOSTED_EXACT_HEAD_PASS",
            "head_sha":os.environ["GITHUB_SHA"],
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "parent_a9d_head":"8d2323da735720478c50eab068f844d9a3c0948d",
            "parent_a9d_run":35927873890,
            "parent_a9d_artifact":10780042332,
            "certificate_source":src["certificate_source"],
            "warrant_source":src["warrant_source"],
            "binding":src["binding"],
            "generated_lean":src["generated_lean"],
            "python_tests":32,
            "claim_boundary":src["claim_boundary"]
          }
          Path("out/clc-provenance-attestation-v0.json").write_text(
              json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: clc-provenance-attestation-v0
          path: |
            out/clc-provenance-attestation-v0.json
            out/provenance-attestation-axiom-audit.txt
            out/python-tests.txt
