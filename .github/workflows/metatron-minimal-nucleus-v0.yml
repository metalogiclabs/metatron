name: Metatron Minimal Nucleus V0

on:
  push:
    branches: [metatron-minimal-warrant-graph-v0]
    paths-ignore:
      - 'evidence/qualified-runs/minimal-warrant-graph-v0-latest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metatron-minimal-nucleus-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate existing evidence
        run: |
          python scripts/check_manifest.py
          python -m unittest tests.test_manifest -v

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject local proof placeholders
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|constant|unsafe)([^[:alnum:]_]|$)' formal/Metatron

      - name: Build Lean warrant semantics
        run: |
          lake build Metatron
          lake build metatron_reference

      - name: Run minimal-nucleus and external-policy suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Attest minimal nucleus
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("runtime/metatron/nucleus.py").read_text().splitlines()
          semantic_lines = [
              line for line in source
              if line.strip() and not line.lstrip().startswith("#")
          ]
          qualified_path = Path(
              "evidence/qualified-runs/minimal-warrant-graph-v0.json"
          )
          qualified_sha = None
          if qualified_path.exists():
              qualified_sha = json.loads(
                  qualified_path.read_text()
              ).get("qualified_implementation_sha")

          record = {
              "schema_version": 2,
              "head_sha": os.environ["GITHUB_SHA"],
              "previous_qualified_implementation_sha": qualified_sha,
              "workflow_run": {
                  "id": int(os.environ["GITHUB_RUN_ID"]),
                  "url": (
                      f'{os.environ["GITHUB_SERVER_URL"]}/'
                      f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
                      f'{os.environ["GITHUB_RUN_ID"]}'
                  ),
                  "conclusion": "success",
              },
              "nucleus": {
                  "file": "runtime/metatron/nucleus.py",
                  "sha256": __import__("hashlib").sha256(
                      Path("runtime/metatron/nucleus.py").read_bytes()
                  ).hexdigest(),
                  "semantic_lines": len(semantic_lines),
                  "line_budget": 120,
                  "runtime_dependencies": "python-standard-library-only",
                  "formal_dependencies": "Lean core only",
                  "authoritative_state": "immutable tuple[Node, ...]",
                  "public_runtime_types": ["Node", "Log (tuple alias)"],
                  "primitive_transition": "append(Log, Node) -> Log",
                  "formal_reference": "formal/Metatron/WarrantGraph.lean",
              },
          }
          Path("/tmp/metatron-minimal-nucleus-v0.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: metatron-minimal-nucleus-v0
          path: /tmp/metatron-minimal-nucleus-v0.json
          if-no-files-found: error

      - name: Persist exact-head qualification record
        env:
          QUALIFY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          test "$QUALIFY_STATUS" = "success"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          attestation = json.loads(
              Path("/tmp/metatron-minimal-nucleus-v0.json").read_text()
          )
          record = {
              "schema_version": 1,
              "name": "Metatron Minimal Warrant Log — Pure Immutable Head",
              "status": "QUALIFIED_IMPLEMENTATION",
              "qualified_implementation_sha": os.environ["GITHUB_SHA"],
              "qualified_implementation_run": {
                  "id": int(os.environ["GITHUB_RUN_ID"]),
                  "conclusion": "success",
                  "url": (
                      f'{os.environ["GITHUB_SERVER_URL"]}/'
                      f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
                      f'{os.environ["GITHUB_RUN_ID"]}'
                  ),
              },
              "nucleus": attestation["nucleus"],
              "previous_qualified_implementation_sha": (
                  attestation.get("previous_qualified_implementation_sha")
              ),
              "claim": (
                  "Metatron runtime authority is a pure immutable tuple of "
                  "content-addressed warranted nodes; append is the only "
                  "state transition, and live closure/revocation are derived."
              ),
          }
          path = Path(
              "evidence/qualified-runs/"
              "minimal-warrant-graph-v0-latest.json"
          )
          path.write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/qualified-runs/minimal-warrant-graph-v0-latest.json
          git commit -m "evidence: qualify pure immutable warrant log" || exit 0
          git push origin HEAD:metatron-minimal-warrant-graph-v0
