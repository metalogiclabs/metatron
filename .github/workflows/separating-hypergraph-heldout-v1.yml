name: Separating Hypergraph Held-Out V1

on:
  push:
    branches:
      - separating-hypergraph-heldout-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrospective-heldout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run retrospective held-out tests
        run: python -m unittest discover -s tests -p 'test_separating_hypergraph_heldout_v1.py' -v
      - name: Emit retrospective report
        run: |
          python -m scripts.separating_hypergraph_heldout_v1 > separating-hypergraph-heldout-v1.json
          cat separating-hypergraph-heldout-v1.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: separating-hypergraph-heldout-v1
          path: separating-hypergraph-heldout-v1.json
