name: Blind Causal Repair V1

on:
  push:
    branches:
      - blind-causal-repair-v1
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate fresh hidden causal world
        run: |
          mkdir -p out/public out/hidden
          python -m scripts.blind_causal_repair_v1_generate \
            --public out/public/public.json \
            --hidden out/hidden/hidden.json \
            | tee out/generate-summary.json
      - name: Upload public challenge
        uses: actions/upload-artifact@v4
        with:
          name: blind-causal-v1-public
          path: out/public/public.json
      - name: Upload sealed hidden challenge
        uses: actions/upload-artifact@v4
        with:
          name: blind-causal-v1-hidden
          path: out/hidden/hidden.json

  predict:
    needs: generate-seal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download public challenge only
        uses: actions/download-artifact@v4
        with:
          name: blind-causal-v1-public
          path: in/public
      - name: Assert hidden challenge absent
        run: |
          test ! -e in/hidden
          test ! -e in/hidden.json
      - name: Commit causal repair prediction
        run: |
          mkdir -p out
          python -m scripts.blind_causal_repair_v1_predict \
            --public in/public/public.json \
            --prediction out/prediction.json \
            | tee out/prediction-summary.json
      - name: Upload committed prediction
        uses: actions/upload-artifact@v4
        with:
          name: blind-causal-v1-prediction
          path: out/prediction.json

  reveal:
    needs:
      - generate-seal
      - predict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: blind-causal-v1-public
          path: in/public
      - uses: actions/download-artifact@v4
        with:
          name: blind-causal-v1-hidden
          path: in/hidden
      - uses: actions/download-artifact@v4
        with:
          name: blind-causal-v1-prediction
          path: in/prediction
      - name: Reveal hidden semantics and verify prediction
        run: |
          mkdir -p out
          python -m scripts.blind_causal_repair_v1_reveal \
            --public in/public/public.json \
            --hidden in/hidden/hidden.json \
            --prediction in/prediction/prediction.json \
            --report out/reveal.json
      - uses: actions/upload-artifact@v4
        with:
          name: blind-causal-v1-reveal
          path: out/reveal.json
