name: CLC Developmental Relation V0

on:
  push:
    branches: [clc-developmental-relation-v0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clc-developmental-relation-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theorem-gate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject proof placeholders
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' \
            formal/Metatron/DevelopmentalRelation.lean

      - name: Build theorem package
        run: lake build Metatron

      - name: Check theorem names and claim boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          lean = Path("formal/Metatron/DevelopmentalRelation.lean").read_text()
          spec = Path("spec/CLC_DEVELOPMENTAL_RELATION_V0.md").read_text()
          for name in [
              "quotientRelation_contains_graph",
              "quotientRelation_total",
              "quotientRelation_least",
              "quotientRelation_functional_iff_preserves",
              "quotientRelation_not_functional_of_split",
              "forgetRefinement_surjective",
              "forgetRefinement_not_injective_of_strict",
              "protectedGrowth_relation_not_functional",
              "quotientRelation_id_iff_eq",
              "quotientRelation_comp_oplax",
              "quotientRelation_comp_reverse_of_preserves",
              "quotientRelation_comp_eq_of_preserves",
              "forgetRefinement_id",
              "forgetRefinement_comp",
          ]:
              assert f"theorem {name}" in lean, name
          assert "total relations" in spec
          assert "backward forgetful surjection" in spec
          assert "oplax" in spec
          assert "system of quotient views" in spec
          assert "bundled oplax functor structure" in spec
          print("DEVELOPMENTAL_RELATION_CLAIM_BOUNDARY_OK")
          PY
