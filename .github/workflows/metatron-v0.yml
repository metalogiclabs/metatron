name: Metatron V0

on:
  push:
    branches: [main, metatron-v0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate evidence manifest
        run: |
          python scripts/check_manifest.py
          python -m unittest tests.test_manifest -v

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Mathlib
        run: |
          lake update
          lake exe cache get

      - name: Reject local proof placeholders
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|constant|unsafe)([^[:alnum:]_]|$)' formal/Metatron

      - name: Build Lean reference semantics
        run: |
          lake build Metatron
          lake build metatron_reference
          lake env lean formal/Metatron/FixtureTest.lean

      - name: Run Python and differential tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Write evidence closure attestation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record_path = Path("evidence/qualified-runs/metatron-v0.json")
          qualified_sha = None
          if record_path.exists():
              record = json.loads(record_path.read_text())
              qualified_sha = record.get("qualified_implementation_sha")

          attestation = {
              "schema_version": 1,
              "evidence_closure_sha": os.environ["GITHUB_SHA"],
              "workflow_run": {
                  "id": int(os.environ["GITHUB_RUN_ID"]),
                  "url": (
                      f'{os.environ["GITHUB_SERVER_URL"]}/'
                      f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
                      f'{os.environ["GITHUB_RUN_ID"]}'
                  ),
                  "conclusion": "success"
              },
              "qualified_implementation_sha": qualified_sha
          }
          Path("/tmp/metatron-v0-evidence-closure.json").write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload evidence closure attestation
        uses: actions/upload-artifact@v4
        with:
          name: metatron-v0-evidence-closure
          path: /tmp/metatron-v0-evidence-closure.json
          if-no-files-found: error
