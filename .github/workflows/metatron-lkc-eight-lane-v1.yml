name: Metatron LKC Eight Lane V1

on:
  push:
    branches: [metatron-lkc-eight-lane-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate minimal nucleus evidence
        run: |
          python scripts/check_manifest.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Enforce tiny nucleus budget
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("runtime/metatron/nucleus.py")
          lines=[l for l in p.read_text().splitlines() if l.strip() and not l.lstrip().startswith("#")]
          print("semantic_lines",len(lines))
          assert len(lines) <= 120
          PY
      - name: Attest campaign state
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d={
            "schema_version":1,
            "head_sha":os.environ["GITHUB_SHA"],
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "record":"benchmarks/lean_kernel/records/eight-lane-status-v1.json",
            "minimal_nucleus_qualified_sha":"1d0d962fc3d8894804ced6b510cfaa0f25d10f06",
            "partition_local_contender":"v13-three-compiled",
            "primecount_state":"screen-win-proof-required"
          }
          Path("/tmp/metatron-lkc-eight-lane-v1.json").write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metatron-lkc-eight-lane-v1
          path: /tmp/metatron-lkc-eight-lane-v1.json
          if-no-files-found: error
