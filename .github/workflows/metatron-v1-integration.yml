name: Metatron V1 Integration Seal

on:
  push:
    branches:
      - metatron-v1-integration
      - causal-linearization-invariance-v0
      - causal-trace-quotient-v0
      - finite-poset-toposort-connectivity-v0
      - earned-commutation-basis-v0
      - behavioral-commutation-v0
      - blind-future-quotient-v0
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metatron-v1-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify trusted thin waist
        run: |
          set -euo pipefail
          test "$(git hash-object runtime/metatron/nucleus.py)" = "d9d4293e54471714bf098593bf4018c3f6403273"
          test "$(git hash-object formal/Metatron/WarrantGraph.lean)" = "d2affc0a57a1815f303f6f1859941465c69e7d32"
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("runtime/metatron/nucleus.py")
          src=p.read_text()
          semantic=[x for x in src.splitlines() if x.strip() and not x.lstrip().startswith("#")]
          assert len(semantic) == 119, len(semantic)
          tree=ast.parse(src)
          roots=set()
          for n in ast.walk(tree):
              if isinstance(n,ast.Import):
                  roots.update(a.name.split(".")[0] for a in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module:
                  roots.add(n.module.split(".")[0])
          assert roots <= {"dataclasses","hashlib","json","__future__"}, roots
          for token in ("NebulaMachine","Aha","tau","PortEventStructure"):
              assert token not in src
          print("TRUSTED_THIN_WAIST_IDENTICAL")
          PY

      - name: Verify integration source pins
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/integration/metatron-v1-sources.json").read_text())
          assert d["trusted_core"]["source_branch_head"] == "c14b74929e64f6c819d320698079147356480b16"
          assert d["trusted_core"]["qualified_implementation_sha"] == "13b1f6b52ee4724e33a6063c18c4a105f20bb0bc"
          assert d["trusted_core"]["qualification_run"] == 35764668476
          assert d["semantics"]["source_head"] == "20844ab1c68b8c4f9d6528a191eb136c0bdce791"
          assert d["search_policy"]["source_head"] == "b2dc8d1599add03bf6e6d0a3cd6aa4555257512b"
          assert d["search_policy"]["qualification_run"] == 35761034357
          assert d["search_policy"]["verdict"] == "BLIND_PROSPECTIVE_PASS"
          assert d["external_adapter"]["source_head"] == "b2d384087e79719f384852688d730cb0d56a1d7d"
          assert d["causal_repair"]["source_head"] == "31dfdef5f733455037df200256c3b487c6a38aae"
          assert d["causal_repair"]["qualification_run"] == 35776123412
          assert d["causal_repair"]["theorem"] == "causalRepairCover_iff_targetSufficient"
          assert d["blind_causal_repair"]["source_head"] == "6e80f6bfcde314cbc81624c8f432ed1d100dab20"
          assert d["blind_causal_repair"]["qualification_run"] == 35786529656
          assert d["blind_causal_repair"]["verdict"] == "BLIND_CAUSAL_REPAIR_PASS"
          assert d["blind_causal_repair"]["minimum_event_count"] == 2
          assert d["blind_causal_repair"]["minimum_causal_class_count"] == 1
          assert d["causal_linearization"]["source_head"] == "4d964e5e2dfb5e83eed8ec20a0bb841fb398f8f6"
          assert d["causal_linearization"]["qualification_run"] == 35789279601
          assert d["causal_linearization"]["positive_theorem"] == "independentSwap_invariant_of_commute"
          assert d["causal_linearization"]["negative_theorem"] == "causalStructureAlone_not_enough"
          assert d["causal_trace_quotient"]["source_head"] == "9c9d2578039cd718326a7487484ff2690251bd88"
          assert d["causal_trace_quotient"]["qualification_run"] == 35796549933
          assert d["causal_trace_quotient"]["execution_theorem"] == "traceEq_preserves_run"
          assert d["causal_trace_quotient"]["topological_theorem"] == "topological_linearizations_equivalent_if_traceConnected"
          assert d["finite_poset_connectivity"]["source_head"] == "43da18d8317258f7f421d7cea05e1ca844f800ee"
          assert d["finite_poset_connectivity"]["qualification_run"] == 35798130149
          assert d["finite_poset_connectivity"]["connectivity_theorem"] == "all_topological_sorts_traceConnected"
          assert d["finite_poset_connectivity"]["pes_semantic_theorem"] == "pes_all_topological_sorts_semantically_invariant"
          assert d["earned_commutation"]["source_head"] == "17ea61342e1666dcf91dddb95aae09954a6aa2ca"
          assert d["earned_commutation"]["qualification_run"] == 35807759558
          assert d["earned_commutation"]["verdict"] == "BLIND_EARNED_COMMUTATION_PASS"
          assert d["earned_commutation"]["minimum_pair_basis_size"] == 3
          assert d["behavioral_commutation"]["source_head"] == "69f642c8be6774cec06effc530adbc254d15984c"
          assert d["behavioral_commutation"]["qualification_run"] == 35811799527
          assert d["behavioral_commutation"]["verdict"] == "BLIND_BEHAVIORAL_COMMUTATION_PASS"
          assert d["behavioral_commutation"]["strict_gain_pair_count"] == 1
          assert d["behavioral_commutation"]["minimum_behavioral_basis_size"] == 5
          assert d["future_quotient_discovery"]["source_head"] == "64f2f541cd0c6edb681de065179fd81a40b629da"
          assert d["future_quotient_discovery"]["qualification_run"] == 35812504704
          assert d["future_quotient_discovery"]["verdict"] == "BLIND_FUTURE_QUOTIENT_PASS"
          assert d["future_quotient_discovery"]["future_block_sizes"] == [2, 2]
          assert d["future_quotient_discovery"]["strict_gain_pair_count"] == 1
          assert d["search_policy"]["authority"] == "external_policy"
          assert d["external_adapter"]["authority"] == "external_evidence_policy"
          print("INTEGRATION_SOURCE_PINS_OK")
          PY

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Validate retained Python suite
        run: |
          python scripts/check_manifest.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Reject proof placeholders
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Metatron

      - name: Build integrated formal stack
        run: |
          lake build Metatron
          lake build metatron_reference

      - name: Verify bridge theorem and claim boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          additive=Path("formal/Metatron/ResidualBasis.lean").read_text()
          causal=Path("formal/Metatron/CausalRepairCover.lean").read_text()
          linear=Path("formal/Metatron/CausalLinearization.lean").read_text()
          trace=Path("formal/Metatron/CausalTraceQuotient.lean").read_text()
          poset=Path("formal/Metatron/FinitePosetConnectivity.lean").read_text()
          earned=Path("formal/Metatron/EarnedCommutation.lean").read_text()
          behavioral=Path("formal/Metatron/BehavioralCommutation.lean").read_text()
          future=Path("formal/Metatron/FutureObservations.lean").read_text()
          spec=Path("spec/METATRON_V1_INTEGRATION.md").read_text()
          for name in (
              "certifiedResidualBasis_closes",
              "minimumResidualBasis_minimalSufficient",
          ):
              assert f"theorem {name}" in additive, name
          for name in (
              "causalRepairCover_iff_targetSufficient",
              "minimumCausalRepair_minimalSufficient",
              "singleton_support_is_arity_one",
              "ab_causal_repair_covers",
              "ba_causal_repair_fails_cover",
          ):
              assert f"theorem {name}" in causal, name
          for name in (
              "independentSwap_invariant_of_commute",
              "independentObservation_invariant_of_commute",
              "independent_swapSafe_of_commute",
              "causalStructureAlone_not_enough",
              "ab_not_swapSafe",
          ):
              assert f"theorem {name}" in linear, name
          for name in (
              "traceEq_preserves_run",
              "traceEq_preserves_observation",
              "topological_linearizations_equivalent_if_traceConnected",
              "three_event_trace_same_state",
              "ab_same_pes_not_trace_quotiented",
          ):
              assert f"theorem {name}" in trace, name
          for name in (
              "all_topological_sorts_traceConnected",
              "posetTrace_to_semanticTrace",
              "all_topological_sorts_semantically_invariant",
              "pes_topological_sorts_traceConnected",
              "pes_all_topological_sorts_semantically_invariant",
          ):
              assert f"theorem {name}" in poset, name
          for name in (
              "earnedTrace_to_semanticTrace",
              "earnedTrace_preserves_run",
              "sameEarnedComponent_semantically_equal",
              "all_topological_sorts_equal_if_all_incomparables_earned",
          ):
              assert f"theorem {name}" in earned, name
          for name in (
              "behavioral_adjacent_swap_preserves",
              "behavioralTrace_preserves",
              "futureBehavioralTrace_preserves",
              "behavioral_commutation_strictly_extends_exact",
          ):
              assert f"theorem {name}" in behavioral, name
          for name in (
              "futureEq_stepClosed",
              "admissible_le_futureEq",
              "continuationSafe_eq_gfp",
          ):
              assert f"theorem {name}" in future, name
          assert "minimum certified causal repair frontier" in spec
          assert "BLIND_BEHAVIORAL_COMMUTATION_PASS" in spec
          assert "BLIND_FUTURE_QUOTIENT_PASS" in spec
          assert "minimum warranted behavioral commutation basis" in spec
          assert "No generic property of raw storage-graph geometry is promoted to semantics." in spec
          print("METATRON_V1_INTEGRATION_BOUNDARY_OK")
          PY

      - name: Emit integration attestation
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d={
            "schema_version":1,
            "status":"QUALIFIED_INTEGRATION_CANDIDATE",
            "head_sha":os.environ["GITHUB_SHA"],
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "trusted_authority":"pure append-only warrant log",
            "bridge_theorem":"causalRepairCover_iff_targetSufficient",
            "additive_special_case":"certifiedResidualBasis_closes",
            "causal_repair_run":35776123412,
            "blind_causal_repair_run":35786529656,
            "causal_linearization_run":35789279601,
            "causal_trace_quotient_run":35796549933,
            "finite_poset_connectivity_run":35798130149,
            "earned_commutation_run":35807759558,
            "behavioral_commutation_run":35811799527,
            "future_quotient_discovery_run":35812504704,
            "clc_head":"20844ab1c68b8c4f9d6528a191eb136c0bdce791",
            "blind_v3_run":35761034357,
            "minimal_nucleus_run":35764668476,
            "lkc_record":"benchmarks/lean_kernel/records/eight-lane-status-v1.json"
          }
          Path("/tmp/metatron-v1-integration.json").write_text(
              json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metatron-v1-integration
          path: /tmp/metatron-v1-integration.json

  blind-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate fresh sealed challenge
        run: |
          mkdir -p out/public out/hidden
          python -m scripts.blind_hypergraph_v3_generate \
            --public out/public/public.json \
            --hidden out/hidden/hidden.json
      - uses: actions/upload-artifact@v4
        with:
          name: integration-blind-public
          path: out/public/public.json
      - uses: actions/upload-artifact@v4
        with:
          name: integration-blind-hidden
          path: out/hidden/hidden.json

  blind-predict:
    needs: blind-generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: integration-blind-public
          path: in/public
      - name: Prove hidden artifact is absent
        run: test ! -e in/hidden
      - name: Commit public-only prediction
        run: |
          mkdir -p out
          python -m scripts.blind_hypergraph_v3_predict \
            --public in/public/public.json \
            --prediction out/prediction.json
      - uses: actions/upload-artifact@v4
        with:
          name: integration-blind-prediction
          path: out/prediction.json

  blind-reveal:
    needs:
      - blind-generate
      - blind-predict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: integration-blind-public
          path: in/public
      - uses: actions/download-artifact@v4
        with:
          name: integration-blind-hidden
          path: in/hidden
      - uses: actions/download-artifact@v4
        with:
          name: integration-blind-prediction
          path: in/prediction
      - name: Reveal and verify blind prediction
        run: |
          mkdir -p out
          python -m scripts.blind_hypergraph_v3_reveal \
            --public in/public/public.json \
            --hidden in/hidden/hidden.json \
            --prediction in/prediction/prediction.json \
            --report out/reveal.json
      - uses: actions/upload-artifact@v4
        with:
          name: integration-blind-reveal
          path: out/reveal.json
