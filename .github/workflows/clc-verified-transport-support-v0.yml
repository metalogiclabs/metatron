name: CLC VerifiedTransport Frozen Support V0

on:
  push:
    branches:
      - feature/clc-verified-transport-support-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify A9 parent and unchanged trusted waist
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d61b5bb6b8299f79ec44e359fb3723ce3f15f0e7 "$GITHUB_SHA"
          test "$(git hash-object runtime/metatron/nucleus.py)" = "d9d4293e54471714bf098593bf4018c3f6403273"
          test "$(git hash-object formal/Metatron/WarrantGraph.lean)" = "d2affc0a57a1815f303f6f1859941465c69e7d32"
          test "$(git hash-object formal_adapter/CLCMetatronAdapter/Adapter.lean)" = "980a4897f5d4131475aa7ea4084cf9db0d3d4ed4"
          test "$(git hash-object formal_adapter/CLCMetatronAdapter/Regression.lean)" = "6d5ddde569923233396eb1f5f89c289f47e5ad97"
          echo "A9_PARENT_AND_WAIST=PASS"

      - name: Verify pinned CLC transport sources
        run: |
          set -euo pipefail
          test "$(git hash-object formal_adapter/CLC/Transport.lean)" = "fd76f47aba3fcb37ff8d59a6deadd4848f5a239c"
          test "$(git hash-object formal_adapter/CLC/Verdict.lean)" = "47add0bc00e239cfa8dc0786e0f0031669ca04ac"
          curl -fsSL "https://raw.githubusercontent.com/heathsanchez/Minimal-Sufficient-Interface/900a73c1d386ee0eee1205a1cf31d270f3311ef7/qcklean/CLC/Transport.lean" -o /tmp/Transport.lean
          curl -fsSL "https://raw.githubusercontent.com/heathsanchez/Minimal-Sufficient-Interface/900a73c1d386ee0eee1205a1cf31d270f3311ef7/qcklean/CLC/Verdict.lean" -o /tmp/Verdict.lean
          cmp /tmp/Transport.lean formal_adapter/CLC/Transport.lean
          cmp /tmp/Verdict.lean formal_adapter/CLC/Verdict.lean
          echo "PINNED_CLC_TRANSPORT=PASS"

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Recheck unchanged root Metatron
        run: |
          lake build Metatron
          lake build metatron_reference

      - name: Reject proof placeholders
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)'             formal_adapter/CLCMetatronAdapter             formal_adapter/CLC             formal_adapter/Metatron

      - name: Build VerifiedTransport support bridge
        run: |
          cd formal_adapter
          lake update
          lake exe cache get
          lake build CLCMetatronAdapter
          mkdir -p ../out
          lake env lean CLCMetatronAdapter/VerifiedTransportSupportAudit.lean             | tee ../out/verified-transport-axiom-audit.txt

      - name: Enforce axiom boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("out/verified-transport-axiom-audit.txt").read_text()
          assert "sorryAx" not in text, text
          allowed={"propext","Classical.choice","Quot.sound"}
          compact=" ".join(text.splitlines())
          tails=compact.split("depends on axioms:")[1:]
          assert tails, text
          for tail in tails:
              inside=tail.split("[",1)[1].split("]",1)[0]
              seen={x.strip() for x in inside.split(",") if x.strip()}
              assert seen <= allowed, (inside, seen-allowed)
          print("VERIFIED_TRANSPORT_AXIOM_BOUNDARY=PASS")
          PY

      - name: Re-run retained Python authority suite
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          count=suite.countTestCases()
          print("PYTHON_TEST_COUNT",count)
          assert count == 32, count
          PY
          python -m unittest discover -s tests -p 'test_*.py' -v             2>&1 | tee out/python-tests.txt

      - name: Verify frozen theorem and negative separator are present
        run: |
          python - <<'PY'
          from pathlib import Path
          bridge=Path("formal_adapter/CLCMetatronAdapter/VerifiedTransportSupport.lean").read_text()
          tests=Path("formal_adapter/CLCMetatronAdapter/VerifiedTransportSupportTest.lean").read_text()
          for name in (
              "verifiedTransport_support_live",
              "verifiedTransport_static_authority",
              "verifiedTransport_decisive_preserved_with_live_support",
          ):
              assert f"theorem {name}" in bridge, name
          assert "theorem revoked_one_support_cannot_be_live" in tests
          print("FROZEN_VERIFIED_TRANSPORT_BOUNDARY=PASS")
          PY

      - name: Emit qualification artifact
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d={
            "schema":"metatron.clc-verified-transport-support-v0.qualification",
            "status":"HOSTED_EXACT_HEAD_PASS",
            "head_sha":os.environ["GITHUB_SHA"],
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "parent_a9_head":"d61b5bb6b8299f79ec44e359fb3723ce3f15f0e7",
            "parent_a9_run":35924177681,
            "parent_a9_artifact":10778148087,
            "msi_clc_head":"900a73c1d386ee0eee1205a1cf31d270f3311ef7",
            "clc_transport_blob":"fd76f47aba3fcb37ff8d59a6deadd4848f5a239c",
            "clc_verdict_blob":"47add0bc00e239cfa8dc0786e0f0031669ca04ac",
            "theorem":"verifiedTransport_decisive_preserved_with_live_support",
            "negative_separator":"revoked_one_support_cannot_be_live",
            "python_tests":32,
            "claim_boundary":"Static declared certificate-support liveness composed with CLC VerifiedTransport decisive protected-verdict preservation; no runtime universality, dynamic revocation/reclosure, quotient, causal-port, authentication, reversibility, or Nucleus enlargement."
          }
          Path("out/clc-verified-transport-support-v0.json").write_text(
              json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: clc-verified-transport-support-v0
          path: |
            out/clc-verified-transport-support-v0.json
            out/verified-transport-axiom-audit.txt
            out/python-tests.txt
