name: Residual-Driven Interface V0

on:
  push:
    branches: [residual-driven-interface-v0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: residual-driven-interface-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify trusted thin waist
        run: |
          set -euo pipefail
          test "$(git hash-object runtime/metatron/nucleus.py)" = "d9d4293e54471714bf098593bf4018c3f6403273"
          test "$(git hash-object formal/Metatron/WarrantGraph.lean)" = "d2affc0a57a1815f303f6f1859941465c69e7d32"
          echo "TRUSTED_THIN_WAIST_IDENTICAL"

      - name: Run residual-driven tests
        run: |
          python -m unittest tests.test_residual_driven_interface_v0 -v

      - name: Execute experiment
        run: |
          python -m scripts.residual_driven_interface_v0 --out /tmp/residual-driven-interface-v0.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/residual-driven-interface-v0.json").read_text())
          assert d["verdict"] == "PASS_RESIDUAL_ONLY_NEXT_INTERFACE"
          p=d["primary"]
          assert p["selector_parameters"] == ["residual","installed","semantics"]
          assert p["selector_has_target_argument"] is False
          assert p["residual_counts"] == [56,24,8,0]
          assert p["process_sizes"] == [2,2,2]
          assert p["generation_count"] == 3
          assert p["final_residual_count"] == 0
          assert p["restart"]["installed_equal"]
          assert p["restart"]["residual_count"] == 0
          assert p["semantic_sham"]["installed_equal"]
          assert p["semantic_sham"]["residual_count"] == 0
          assert p["knockout"]["restores_seed_interface"]
          assert all(d["rename_control"]["invariants"].values())
          print("RESIDUAL_ONLY_NEXT_INTERFACE_PASS")
          PY

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build retained residual theorem stack
        run: |
          lake build Metatron.ResidualBasis Metatron.ResidualInteractions

      - name: Reject hidden repair table
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          src=Path("scripts/residual_driven_interface_v0.py").read_text()
          tree=ast.parse(src)
          fn=next(
              n for n in tree.body
              if isinstance(n,ast.FunctionDef) and n.name=="choose_next_process"
          )
          args=[a.arg for a in fn.args.args]
          assert args == ["residual","installed","semantics"], args
          assert "target" not in args
          assert "repair_map" not in src
          print("NO_RESIDUAL_TO_REPAIR_TABLE")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: residual-driven-interface-v0
          path: /tmp/residual-driven-interface-v0.json
