name: Warranted Continuation Viability V7

on:
  push:
    branches:
      - warranted-continuation-viability-v7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify V6 lineage and trusted thin waist
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5d8e141f095c23e8ee2d8a3afd40e1264ae2965b HEAD
          test "$(git hash-object runtime/metatron/nucleus.py)" = "d9d4293e54471714bf098593bf4018c3f6403273"
          test "$(git hash-object formal/Metatron/WarrantGraph.lean)" = "d2affc0a57a1815f303f6f1859941465c69e7d32"
          test "$(git hash-object formal/Metatron/WarrantedContinuationViabilityV6.lean)" = "cb30b7d20853496174a75a6bbaf1de3e034474fc"
          echo "V6_LINEAGE_AND_THIN_WAIST_OK"

      - name: Run stateful-kernel and replenishment census
        run: |
          python scripts/warranted_continuation_viability_v7.py | tee /tmp/wcv-v7.txt
          grep -F "WARRANTED_CONTINUATION_VIABILITY_V7=PASS" /tmp/wcv-v7.txt
          grep -F "contention_kernel_chain=4,1,0,0" /tmp/wcv-v7.txt
          grep -F "contention_kernel_size=0" /tmp/wcv-v7.txt
          grep -F "replenished_kernel_chain=4,1,1" /tmp/wcv-v7.txt
          grep -F "replenished_kernel=ready" /tmp/wcv-v7.txt
          grep -F "schedule_01_without_replenishment=False" /tmp/wcv-v7.txt
          grep -F "schedule_10_without_replenishment=False" /tmp/wcv-v7.txt
          grep -F "schedule_01_with_replenishment=True" /tmp/wcv-v7.txt
          grep -F "schedule_10_with_replenishment=True" /tmp/wcv-v7.txt

      - name: Verify claim boundary text
        run: |
          set -euo pipefail
          grep -F "greatest post-fixed viability kernel is exactly empty" spec/WARRANTED_CONTINUATION_VIABILITY_V7.md
          grep -F "replenishment changes the greatest kernel from empty to nonempty" spec/WARRANTED_CONTINUATION_VIABILITY_V7.md
          grep -F "ordering alone does not rescue" spec/WARRANTED_CONTINUATION_VIABILITY_V7.md

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject proof placeholders
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' formal/Metatron

      - name: Build integrated formal stack
        run: lake build Metatron

      - name: Verify theorem surface
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("formal/Metatron/WarrantedContinuationViabilityV7.lean").read_text()
          for name in (
              "ready_live_causal_cover",
              "unauthorized_has_no_live_causal_cover",
              "ready_execution_matches_v6_failure0",
              "ready_execution_matches_v6_failure1",
              "contention_no_postfixed_state",
              "contention_empty_kernel_postfixed",
              "contention_empty_kernel_greatest",
              "replenished_kernel_postfixed",
              "replenished_kernel_greatest",
              "replenished_kernel_exact",
              "scheduling_alone_does_not_restore",
              "replenishment_restores_both_orders",
              "replenishment_changes_empty_to_nonempty_kernel",
              "resource_authority_base_live",
              "resource_authority_revoked_live",
              "finite_state_authority_projection_matches_warrant_graph",
          ):
              assert f"theorem {name}" in src, name
          print("WCV_V7_THEOREM_SURFACE_OK")
          PY

      - name: Emit qualification attestation
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          result={
            "schema_version":1,
            "status":"QUALIFIED_WARRANTED_CONTINUATION_VIABILITY_V7",
            "head_sha":os.environ["GITHUB_SHA"],
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "parent_v6_sha":"5d8e141f095c23e8ee2d8a3afd40e1264ae2965b",
            "parent_v6_run":35929594852,
            "contention_kernel_chain":[4,1,0,0],
            "contention_kernel_size":0,
            "replenished_kernel_chain":[4,1,1],
            "replenished_kernel":["ready"],
            "ordering_alone_restores":False,
            "immediate_replenishment_restores":True,
            "trusted_runtime_changed":False,
            "warrant_graph_changed":False,
            "boundary":"four-state deterministic live-warrant plus one-shot-resource greatest-kernel and immediate-replenishment separator"
          }
          Path("/tmp/warranted-continuation-viability-v7.json").write_text(
            json.dumps(result,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: warranted-continuation-viability-v7
          path: |
            /tmp/warranted-continuation-viability-v7.json
            /tmp/wcv-v7.txt
