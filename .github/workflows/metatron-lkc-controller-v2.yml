name: Metatron LKC Controller V2

on:
  push:
    branches: [metatron-lkc-controller-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Metatron evidence
        run: |
          python scripts/check_manifest.py
          python -m unittest tests.test_manifest -v

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Mathlib
        run: |
          lake update
          lake exe cache get

      - name: Reject local proof placeholders
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|constant|unsafe)([^[:alnum:]_]|$)' formal/Metatron

      - name: Build Lean reference semantics
        run: |
          lake build Metatron
          lake build metatron_reference
          lake env lean formal/Metatron/FixtureTest.lean

      - name: Run full V0 plus controller V1/V2 tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Write controller V2 attestation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          attestation = {
              "schema_version": 1,
              "head_sha": os.environ["GITHUB_SHA"],
              "workflow_run": {
                  "id": int(os.environ["GITHUB_RUN_ID"]),
                  "url": (
                      f'{os.environ["GITHUB_SERVER_URL"]}/'
                      f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
                      f'{os.environ["GITHUB_RUN_ID"]}'
                  ),
                  "conclusion": "success",
              },
              "base_controller_v1": "3c52add4d608c753104208d14424af5b871686d6",
              "record": "benchmarks/lean_kernel/records/partition-v11-v12.json",
              "external_champion": "v5-natfold",
              "next_external_candidate": "v12-two-seed",
              "claim_boundary": (
                  "Local proxy evidence may stage or replace a contender but "
                  "cannot promote the external champion."
              ),
          }
          Path("/tmp/metatron-lkc-controller-v2.json").write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload controller V2 attestation
        uses: actions/upload-artifact@v4
        with:
          name: metatron-lkc-controller-v2
          path: /tmp/metatron-lkc-controller-v2.json
          if-no-files-found: error
